<!-- Supabase > Authentication > Email Templates > "Confirm signup" (premier code d'un nouveau client)
     Objet : {{ .Token }} est votre code TRIPLEX -->
<!DOCTYPE html>
<html lang="fr">
  <body style="margin:0;padding:0;background:#E8D8C0;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#E8D8C0;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#F3EBDD;border:1px solid #CDBB9F;">
            <tr>
              <td style="padding:32px 32px 8px;font-family:Arial,Helvetica,sans-serif;font-size:22px;letter-spacing:8px;color:#24150F;">
                TRIPLEX
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0;font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1.3;color:#24150F;">
                Bienvenue
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.7;color:#5C493D;">
                Voici votre code pour créer votre compte ({{ .Email }}). Saisissez-le sur la page
                où vous l'avez demandé.
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 0;">
                <div style="display:inline-block;background:#FAF8F3;border:1px solid #CDBB9F;padding:16px 24px;font-family:'Courier New',Courier,monospace;font-size:32px;letter-spacing:10px;color:#24150F;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 32px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.7;color:#75685D;">
                Ce code est valable une heure et ne sert qu'une fois. Vous ne l'avez pas demandé ?
                Ignorez simplement cet e-mail, aucun compte ne sera créé.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
